services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: depannia-qdrant
    ports:
      - "6333:6333"   # API REST et tableau de bord : http://localhost:6333/dashboard
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
